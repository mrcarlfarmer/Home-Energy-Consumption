[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "home-energy-monitor"
version = "0.1.0"
description = "Private, lightweight Octopus Home Mini electricity analytics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135.0,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "aiosqlite>=0.21,<1",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "pip-tools>=7.4,<8",
]

[project.scripts]
energy-monitor = "app.main:run"
energy-admin = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = ["db/migrations/*.sql", "static/*", "static/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
mypy_path = "backend"
