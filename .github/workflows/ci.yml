name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check backend tests
      - run: ruff format --check backend tests
      - run: ruff check .github/scripts && ruff format --check .github/scripts
      - run: mypy backend/app
      - run: pytest -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  publish:
    name: Publish verified image
    needs: [test, container]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Select image name
        id: image
        env:
          PACKAGE: ${{ vars.GHCR_PACKAGE || github.repository }}
        run: echo "name=ghcr.io/${PACKAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check private repository publication target
        if: github.event.repository.private
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: python3 .github/scripts/check_registry_visibility.py
      - name: Publish ARM64 and AMD64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify private repository image access
        if: github.event.repository.private
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: python3 .github/scripts/check_registry_visibility.py
      - name: Update latest for current main
        id: latest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          MAIN_REVISION=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$MAIN_REVISION" = "$REVISION" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Main has advanced; retaining this commit image without moving latest."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Write deployment references
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          LATEST_UPDATED: ${{ steps.latest.outputs.updated }}
        run: |
          {
            echo '## Verified container image'
            echo
            printf 'Commit tag: `%s:sha-%s`\n\n' "$IMAGE" "$REVISION"
            printf 'Exact Portainer image: `%s@%s`\n\n' "$IMAGE" "$DIGEST"
            if [ "$LATEST_UPDATED" = true ]; then
              printf 'Latest alias: `%s:latest` (updated to this build).\n\n' "$IMAGE"
            else
              echo 'Latest alias was not changed because main has advanced.'
            fi
            echo 'Platforms: linux/arm64 and linux/amd64.'
            echo 'Deploy manually after taking a database backup. Package visibility is managed separately in GitHub.'
          } >> "$GITHUB_STEP_SUMMARY"
